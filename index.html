<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 年度季佈道會 | 真耶穌教會大溪教會</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #faf9f6; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen border-x border-stone-200 relative pb-10">
    
    <header class="text-center pt-12 pb-8 px-6 bg-white border-b border-stone-200 shadow-sm relative overflow-hidden">
        <div class="absolute -top-10 -right-10 text-stone-100 opacity-50">
            <i class="fa-solid fa-church text-9xl"></i>
        </div>
        <div class="relative z-10">
            <span class="text-xs font-bold tracking-widest text-stone-500 mb-2 block">真耶穌教會大溪教會</span>
            <h1 class="font-serif text-3xl font-black text-stone-800 tracking-wider">2026 季佈道會專區</h1>
            <p class="text-xs text-stone-500 mt-2">點擊下方進入各季節專屬電子邀請卡</p>
        </div>
    </header>

    <main class="px-5 py-6 space-y-4">
        <!-- 春季 -->
        <a href="./spring/" class="block bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
            <div class="absolute right-0 bottom-0 opacity-20 transform group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-leaf text-6xl text-emerald-500 -mr-4 -mb-4"></i>
            </div>
            <div class="relative z-10">
                <span class="inline-block bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded mb-2">春季 Spring</span>
                <h2 class="font-serif text-xl font-bold text-emerald-900">春季靈恩佈道會</h2>
                <p class="text-xs text-emerald-700 mt-1">進入春季底稿 (未定)</p>
            </div>
        </a>

        <!-- 夏季 -->
        <a href="./summer/" class="block bg-gradient-to-r from-sky-50 to-blue-50 border border-sky-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
            <div class="absolute right-0 bottom-0 opacity-20 transform group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-sun text-6xl text-sky-500 -mr-4 -mb-4"></i>
            </div>
            <div class="relative z-10">
                <span class="inline-block bg-sky-500 text-white text-[10px] font-bold px-2 py-0.5 rounded mb-2">夏季 Summer</span>
                <h2 class="font-serif text-xl font-bold text-sky-900">夏季福音茶會</h2>
                <p class="text-xs text-sky-700 mt-1">進入夏季底稿 (未定)</p>
            </div>
        </a>

        <!-- 秋季 -->
        <a href="./autumn/" class="block bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-100 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
            <div class="absolute right-0 bottom-0 opacity-20 transform group-hover:scale-110 transition-transform">
                <i class="fa-brands fa-canadian-maple-leaf text-6xl text-amber-500 -mr-4 -mb-4"></i>
            </div>
            <div class="relative z-10">
                <span class="inline-block bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded mb-2">秋季 Autumn</span>
                <h2 class="font-serif text-xl font-bold text-amber-900">生命的道路</h2>
                <p class="text-xs text-amber-700 mt-1">秋季靈恩佈道會 (已完成)</p>
            </div>
        </a>

        <!-- 冬季 -->
        <a href="./winter/" class="block bg-gradient-to-r from-slate-100 to-gray-100 border border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden group">
            <div class="absolute right-0 bottom-0 opacity-20 transform group-hover:scale-110 transition-transform">
                <i class="fa-regular fa-snowflake text-6xl text-slate-500 -mr-4 -mb-4"></i>
            </div>
            <div class="relative z-10">
                <span class="inline-block bg-slate-600 text-white text-[10px] font-bold px-2 py-0.5 rounded mb-2">冬季 Winter</span>
                <h2 class="font-serif text-xl font-bold text-slate-900">走過死蔭幽谷</h2>
                <p class="text-xs text-slate-700 mt-1">冬季月佈道會 (已完成)</p>
            </div>
        </a>
    </main>
    
    <footer class="text-center text-[10px] text-stone-400 mt-4">
        &copy; 2026 真耶穌教會大溪教會 版權所有
    </footer>
</body>
</html>
