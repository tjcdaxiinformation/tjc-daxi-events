<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>【填寫主題】 | 2026大溪教會夏季佈道會</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { summer: { 100: '#e0f2fe', 500: '#0ea5e9', 800: '#075985', 900: '#082f49' } },
                    fontFamily: { serif: ['"Noto Serif TC"', 'serif'], sans: ['"Noto Sans TC"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style> body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-white pb-20 shadow-2xl overflow-x-hidden border-x border-summer-100">

    <!-- 視覺海報區 -->
    <header class="bg-gradient-to-br from-summer-100 to-white px-6 pt-12 pb-16 relative overflow-hidden flex flex-col items-center text-center border-b border-summer-100">
        <i class="fa-solid fa-water text-summer-500/20 text-9xl absolute -right-10 -top-10"></i>
        
        <div class="border border-summer-500 text-summer-800 bg-white/50 backdrop-blur-sm text-xs px-4 py-1.5 rounded-full mb-6 tracking-widest font-bold">
            真耶穌教會大溪教會 · 2026夏季佈道會
        </div>
        
        <h2 class="text-sm font-serif text-summer-800 mb-2 tracking-widest">【副標題/福音茶會】</h2>
        <h1 class="font-serif font-black text-5xl tracking-wide mb-4 text-summer-900 leading-tight">
            【請輸入主題】
        </h1>
        <p class="font-serif text-sm text-summer-800 mb-8 tracking-widest">— 【引言或經文】 —</p>
        
        <div class="bg-white/80 backdrop-blur-md border border-summer-200 rounded-2xl p-4 w-full text-left shadow-sm">
            <div class="flex items-center gap-3 mb-2">
                <div class="bg-summer-500 text-white font-bold px-2 py-1 rounded text-xs">
                    2026/07/XX (六)
                </div>
                <div class="text-summer-900 text-sm font-bold">
                    <i class="fa-regular fa-clock text-summer-500 mr-1"></i> 09:30 - 11:00
                </div>
            </div>
            <div class="text-slate-600 text-xs mt-2 flex items-start gap-2">
                <i class="fa-solid fa-location-dot mt-0.5 text-summer-500"></i>
                <p>桃園市大溪區民權東路185巷31號<br><span class="text-[10px] text-slate-400">會後備有中午愛餐，歡迎留下享用</span></p>
            </div>
        </div>
    </header>

    <!-- 流程表 -->
    <section class="px-5 mt-8 mb-8">
        <div class="flex items-center gap-2 mb-4 pl-1">
            <span class="w-1.5 h-4 bg-summer-500 rounded-full"></span>
            <h3 class="font-serif font-bold text-lg text-summer-900">聚會程序表</h3>
        </div>
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-summer-100 text-sm">
            <div class="flex justify-between border-b border-slate-100 py-2">
                <span class="text-slate-500 font-bold w-16">09:50</span>
                <span class="flex-1 text-slate-800">會前唱詩</span>
            </div>
            <div class="flex justify-between border-b border-slate-100 py-2">
                <span class="text-summer-500 font-bold w-16">10:00</span>
                <span class="flex-1 text-summer-900 font-bold">見證分享：【請填寫】<br><span class="text-xs text-slate-500 font-normal">主講：【請填寫】</span></span>
            </div>
            <div class="flex justify-between border-b border-slate-100 py-2">
                <span class="text-slate-500 font-bold w-16">10:40</span>
                <span class="flex-1 text-slate-800">詩班獻詩</span>
            </div>
            <div class="flex justify-between border-b border-slate-100 py-2">
                <span class="text-slate-500 font-bold w-16">10:50</span>
                <span class="flex-1 text-slate-800">祈求靈恩</span>
            </div>
            <div class="flex justify-between py-2">
                <span class="text-slate-500 font-bold w-16">會後</span>
                <span class="flex-1 text-emerald-600 font-bold"><i class="fa-solid fa-utensils mr-1"></i> 中午愛餐</span>
            </div>
        </div>
    </section>

    <!-- 固定的聯絡資訊區 (免修改) -->
    <section class="px-5 pb-6">
        <a href="https://line.me/ti/p/U3XGjc8GKN" target="_blank" class="block w-full bg-[#06C755] text-white text-center py-4 rounded-xl font-bold shadow-lg mb-4 text-sm flex items-center justify-center gap-2">
            <i class="fa-brands fa-line text-lg"></i> 加入 LINE 好友報名 / 聯繫專人
        </a>
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 text-center">
            <p class="text-xs text-slate-500 font-bold mb-2">聯絡窗口：宣道股負責人 王鴻志 弟兄</p>
            <div class="flex items-center justify-center gap-4">
                <a href="tel:0916336821" class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg text-slate-700 text-xs font-bold shadow-sm border border-slate-200">
                    <i class="fa-solid fa-phone text-summer-800"></i> 0916-336-821
                </a>
                <a href="https://www.google.com/maps/search/?api=1&query=桃園市大溪區民權東路185巷31號" target="_blank" class="flex items-center gap-2 bg-white px-4 py-2 rounded-lg text-slate-700 text-xs font-bold shadow-sm border border-slate-200">
                    <i class="fa-solid fa-map-location-dot text-summer-800"></i> 開啟地圖
                </a>
            </div>
        </div>
    </section>
</body>
</html>
